name: Check

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    # sbxmが動くのはmacOSだけ。hostのtoolや速さの違いで落ちるtestを、releaseの前に見つける。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up toolchain
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          install: true
          # jdx/mise-action#215: cacheを使うとrustupのprofile componentsが
          # 復元されず、rustfmtが入らないことがある。直るまで無効にする。
          cache: false

      - name: Run fmt, lint, tests, coverage, and the release script tests
        run: mise run check

      - name: "一時: macOSでtestを繰り返し、安定して通るか確かめる"
        if: matrix.os == 'macos-latest'
        run: for i in 1 2 3 4 5; do echo "== round $i"; mise run coverage || exit 1; done
