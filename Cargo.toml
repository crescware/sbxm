[package]
name = "sbxm"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
description = "CLI for managing Docker Sandboxes: per-project setup and daily operations"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
dialoguer = { version = "0.12.0", default-features = false }
dirs = "6.0.0"
fluent-bundle = "0.16.0"
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
toml = "1.1.3"
unic-langid = "0.9.6"

[dev-dependencies]
fluent-syntax = "0.12.0"
