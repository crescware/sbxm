[workspace]

[package]
name = "sbxm"
version = "0.0.1"
edition = "2024"
rust-version = "1.89"
description = "CLI for managing Docker Sandboxes: per-project setup and daily operations"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6.4", default-features = false, features = [
  "std",
  "help",
  "usage",
  "error-context",
  "suggestions",
] }
# 端末styleとkey入力の唯一の供給元。`src/design`だけがこのcrateをimportし、その型を
# module外へ公開しない。
console = { version = "0.16.4", default-features = false, features = [
  "std",
  "ansi-parsing",
] }
dirs = "6.0.0"
fluent-bundle = "0.16.0"
rustix = { version = "1.1.4", default-features = false, features = [
  "process",
  "std",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = { version = "0.11.0", default-features = false }
tempfile = "3.27.0"
unic-langid = "0.9.6"
yaml_serde = "0.10"

[dev-dependencies]
fluent-syntax = "0.12.0"
syn = { version = "2.0.0", features = ["full"] }

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# デフォルトLint
all = { level = "deny", priority = -1 }

# より厳格で、多少の誤検知を許容するLint
pedantic = { level = "deny", priority = -1 }

# AIが安易に生成しやすい処理を個別に禁止
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

# 不用意な標準出力を防ぐ
print_stdout = "deny"
print_stderr = "deny"

# unsafeを許可するプロジェクトの場合に有効
undocumented_unsafe_blocks = "deny"
