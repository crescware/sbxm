[tools]
# sbxmが動くのはmacOSだけだが、開発はLinuxでも行う。macOS向けにcompileできることを
# Linuxからも確かめられるよう、targetをtoolchainへ含める。
# profileを明示しないとminimalになりrustfmt/clippyを含まない。`mise run check`が
# 要る両方を持たせるため、defaultを明示する。
rust = { version = "1.89.0", targets = "aarch64-apple-darwin", profile = "default" }
zig = "0.16.0"
"github:taiki-e/cargo-llvm-cov" = "0.8.7"

[tasks.fmt]
description = "sourceを整形する"
run = "cargo fmt --all"

[tasks.coverage]
description = "testを実行してcoverageの最低基準を確認する"
run = '''
cargo llvm-cov \
  --workspace \
  --all-features \
  --summary-only \
  --ignore-filename-regex '(^|/)tests/|(^|/)src/testing/|(^|/)fake/|[^/]*_test[^/]*\.rs$' \
  --fail-under-lines 97 \
  --fail-under-functions 97 \
  --fail-under-regions 95 \
  --fail-under-file-lines 90
'''

[tasks.i18n]
description = "辞書と実装の対応、辞書どうしの一致を確認する"
run = "cargo test --test ftl"

[tasks.check-macos]
description = "macOS向けにcompileできることを確認する"
run = "cargo check --workspace --all-targets --all-features --target aarch64-apple-darwin"

[tasks.release-test]
description = "scripts/release/release.shのend-to-end testを実行する"
run = "scripts/release/release_test.sh"

[tasks.check]
description = "整形・lint・辞書・macOS向けcompile・test・coverage・release scriptのtestをすべて確認する"
run = "cargo fmt --all -- --check && cargo clippy --workspace --all-targets --all-features -- -D warnings && mise run i18n && mise run check-macos && mise run coverage && mise run release-test"
